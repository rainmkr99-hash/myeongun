  if (Math.abs(ls - dayStem) === 5) {

        const hwaEl = STEM_HAP_EL[Math.min(ls, s)];

        d: `${EL_HANJA[g.el]} 기운이 크게 일어나는 시기로, ` + (r > 0 ? "이 기운이 나를 돕는 쪽이라 큰 세력을 등에 업는 모양입니다. 평소보다 큰 그림을 그려도 좋습니다." : r < 0 ? "이 기운이 나에게는 부담이라, 큰 물결에 휩쓸리기 쉽습니다. 이 시기의 확장·투자는 한 단계 줄이세요." : "국면 전체가 한 방향으로 강하게 움직입니다. 흐름을 거스르지 말고 올라타되, 출구는 정해 두세요.")

  /* v1.6 (일운) 반합(半合) — 왕지(子午卯酉)를 포함한 두 글자가 원국 지지와 만나 국(局)의 절반을 이룸. 삼합이 완성된 날은 제외 */
  if (fine && !events.some(e => e.conv)) {

    for (const [pos, b] of natalOnly) {

      if (!pair) continue;

      if (banSeen.has(key)) continue;

        basis: `${pos} ${BRANCHES[b]} + ${label} ${BRANCHES[lb]} → ${g.name.slice(-2)} 반합`,

  /* v1.9 방합(方合) — 같은 계절 세 글자(寅卯辰 등)가 원국·운에 모두 있을 때. 삼합과 같이 국(局)으로 본다 */
  if (fine && !events.some(e => e.conv)) {
    for (const g of BANGHAP_GROUPS) {
      if (!g.set.includes(lb)) continue;

      const r = W_BANGHAP * favor(g.el) * (natalCnt >= 2 ? 1 : natalCnt === 1 ? 0.7 : 0.5);
      score += r;
      addArea(r, AREA_BY_RELIDX[relIdx(g.el)]);
      events.push({
        t: `방합 ${g.name}→${SIPSEONG_GROUP[relIdx(g.el)]}`,
        w: 1.1,
        sc: r,
        el: g.el,
        conv: SIPSEONG_GROUP[relIdx(g.el)],
        parts: others.map(o => ((sources.find(([, b]) => b === o) || ["?"])[0]) + " " + BRANCHES[o]),
        act: r > 0 ? "한 계절의 기운이 통째로 실립니다 — 그 영역을 크게 그려도 됩니다" : r < 0 ? "한 계절의 기운이 통째로 밀려옵니다 — 휩쓸리지 않게 한도를 정하세요" : "계절의 기운이 한쪽으로 모입니다 — 흐름을 타되 출구를 두세요",
        basis: others.map(o => `${(sources.find(([, b]) => b === o) || ["?"])[0]} ${BRANCHES[o]}`).join(" + ") + ` + ${label} ${BRANCHES[lb]}`,
        d: `${g.name}이 완성되어 ${EL_HANJA[g.el]}(${SIPSEONG_GROUP[relIdx(g.el)]}) 기운이 계절 전체의 힘으로 일어납니다. ` + (r > 0 ? "나를 돕는 쪽이라 등에 업는 세력입니다." : r < 0 ? "나에게는 부담 쪽이라 휩쓸리기 쉽습니다." : "득실은 중립이니 흐름만 타면 됩니다.")
      });
    }
  }
  const mb = natal.monthP[1];
  /* v1.9 조후(調候) — 궁통보감 조후용신표: 명식이 계절적으로 필요로 하는 천간이 운의 천간(또는 지지 정기)으로 들어올 때 */
  {
    const js = johuStems(prof);
    const JB = [1, 0.6, 0.35, 0.25, 0.2];
    const iS = js.indexOf(ls);
    const iB = js.indexOf(BRANCH_MAIN[lb]);
    let jv = 0;
    const hits = [];
    const jm = kind === "month" ? JOHU_MONTH_MUL : 1;
    if (iS >= 0) {
      jv += W_JOHU * JB[iS] * jm;
      hits.push(`천간 ${STEMS[ls]}(${iS === 0 ? "주" : "보조"}용신)`);
    }
    if (iB >= 0) {
      jv += W_JOHU * JB[iB] * 0.6 * jm;
      hits.push(`지지 ${BRANCHES[lb]}의 ${STEMS[BRANCH_MAIN[lb]]}(${iB === 0 ? "주" : "보조"}용신)`);
    }
    if (jv > 0) {
      score += jv;
      addArea(jv, AREA_REL.조후);
      events.push({
        t: "조후(調候)",
        w: 0.8 + jv,
        sc: jv,
        act: "막혔던 일을 다시 밀어보세요 — 명식이 목말라하던 글자가 들어옵니다",
        basis: `월지 ${BRANCHES[mb]} 조후용신 ${js.map(x => STEMS[x]).join("·")} ← ${label} ${hits.join(", ")}`,
        d: `${STEMS[dayStem]} 일간이 ${BRANCHES[mb]}월에 태어나 계절적으로 필요로 하는 글자(조후용신 ${js.map(x => STEMS[x]).join("·")}) 가운데 ${hits.join("과 ")}이 들어옵니다. 한난조습이 고르게 맞춰져 막혔던 흐름에 숨통이 트이는 보너스 운입니다.`

  if (voidPair && voidPair.includes(lb)) {

  /* v1.14 12신살 나머지(일지 삼합국 기준) + 일간 기준 홍염·금여·암록·학당 + 월지 기준 천의 — 참고 표시(무점수) */
  {

  /* 백호·양인 — 참고 표시(무점수). 발동 조건:
     ① 이 운의 간지 자체가 백호이거나 지지가 일간의 양인일 때

    });
    events.push({

    });
  }
  const natalPls = [["년주", natal.yearP], ["월주", natal.monthP], ["일주", natal.dayP]];
  if (natal.timeP) natalPls.push(["시주", natal.timeP]);
  for (const [pos, pl] of natalPls) {

    if (!isBH && !isYI) continue;
    const relName = (pl[1] + 6) % 12 === lb ? "충" : hyungHit(lb, pl[1]) ? "형" : null;
    if (!relName) continue;
    // v1.9 양인충·백호충은 감점(형은 절반)
    const bv = -(isBH ? W_BAEKHO_CHUNG : W_YANGIN_CHUNG) * (relName === "충" ? 1 : 0.5) * wOf(pos.replace("주", "지")) * (kind !== "year" ? BH_MONTH_MUL : 1);
    score += bv;
    addArea(bv, {
      body: 0.7,
      doc: 0.3
    });
    events.push({
      t: isBH ? "백호 발동" : "양인 발동",

  ev.rawScore = ev.score;
  ev.monthCtx = monthCtx;

  const pct = pctRank(ev.score, dayDist(prof, Y).sorted);
  ev.monthPct = pctRank(monthCtx, monthDist(prof, Y)); // v1.12.1 이달의 상대 위치(풀이용)
  let gi = pct < CUT_DAY[0] ? 0 : pct < CUT_DAY[1] ? 1 : pct < CUT_DAY[2] ? 2 : pct < CUT_DAY[3] ? 3 : 4;
  const rawGi = gi;
  if (ev.samhyungClass === "A" && gi < 3) gi = 3; // A급: 흉/대흉 강제
  else if (ev.samhyungClass === "B" && gi < 2) gi = 2; // B급: 길·대길 금지(상한 평)
  ev.events.sort((a, b) => b.w - a.w);
  return {
    ...ev,
    grade: GRADES[gi],
    pct,
    dwUsed,
    mixed: mixedOf(ev.areas, gi >= 3, "day"),
    forced: gi !== rawGi
  }; // forced: 백분위와 등급이 어긋남(삼형 보정)
}

// 받침 유무에 따른 조사 선택 (은/는)
function withEunNeun(word) {
  const c = word.charCodeAt(word.length - 1);
  const hasBatchim = c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0;
  return word + (hasBatchim ? "은" : "는");
}

// 월운 반전 단서 — 계산 결과에서만 도출 (영역 부호 분리 → 없으면 달 안 상·하위 구간)
function monthClue(prof, Y, mOrd, ev, gi) {
  const ent = AREAS.map(k => [k, ev.areas[k]]);
  const top = ent.reduce((a, b) => b[1] > a[1] ? b : a);
  const bot = ent.reduce((a, b) => b[1] < a[1] ? b : a);
  if (gi === 1 && bot[1] <= -CLUE_MIN) return `다만 ${AREA_KO[bot[0]]} 쪽은 조심하세요.`;
  if (gi === 3 && top[1] >= CLUE_MIN) return `다만 ${AREA_KO[top[0]]} 쪽은 오히려 풀립니다.`;
  if (gi === 2 && top[1] >= CLUE_MIN && bot[1] <= -CLUE_MIN) return `${AREA_KO[top[0]]}에는 힘이 실리고, ${withEunNeun(AREA_KO[bot[0]])} 무겁게 갑니다.`;
  const days = dayDist(prof, Y).days.filter(x => x.mOrd === mOrd);
  if (days.length >= 9) {
    const third = Math.floor(days.length / 3);
    const names = ["초순", "중순", "하순"];
    const means = [0, 1, 2].map(i => {
      const seg = days.slice(i * third, i === 2 ? days.length : (i + 1) * third);
      return seg.reduce((s, x) => s + x.score, 0) / seg.length;
    });
    const bi = means.indexOf(Math.max(...means)),
      wi = means.indexOf(Math.min(...means));
    if (bi !== wi) return `달 안에서는 ${names[bi]}이 낫고, ${names[wi]}에는 속도를 줄이세요.`;
  }
  return "";
}

// 월운: 전후 10년 분포 3분위 + 삼형 완성 달 길 금지 + 반전 단서
function analyzeMonth(prof, y, m, d) {

  const ev = me.ev;
  ev.rawScore = me.rawScore;
  ev.yearCtx = me.yearCtx;
  ev.score = me.score; // 년운 맥락 포함
  const pct = pctRank(me.score, monthDist(prof, Y));
  let gi = pct < CUT_MONTH[0] ? 1 : pct < CUT_MONTH[1] ? 2 : 3;
  const rawGi = gi;
  if (ev.samhyung && gi < 2) gi = 2; // 삼형 완성 달: A·B급 공통으로 길 금지(상한 평)
  const clue = monthClue(prof, Y, mOrd, ev, gi);
  ev.events.sort((a, b) => b.w - a.w);

// 년운 프로파일: 힘 받는·조심할 영역 + 좋은 달·조심할 달(이유 태그 — 등급 부호와 일치하는 근거만)
function tagOfMonth(me, wantSign) {
  const hit = me.ev.events.find(e => e.sc * wantSign > 0);
  if (hit) return hit.t;
  if (me.score * wantSign > 0) return wantSign > 0 ? "오행 흐름 순조" : "오행 흐름 부담";
  return "상대 순위"; // 절대 부호는 반대지만 그 해 안에서 상대적으로 상·하위인 달
}
function buildYearProfile(prof, Y, ev) {
  const ent = AREAS.map(k => [k, ev.areas[k]]);
  const topArea = ent.reduce((a, b) => b[1] > a[1] ? b : a)[0];
  const bottomArea = ent.reduce((a, b) => b[1] < a[1] ? b : a)[0];
  const mes = monthEvalsOfYear(prof, Y);
  mes.forEach(me => me.ev.events.sort((a, b) => b.w - a.w));
  const nameOf = mo => mo === 12 ? "이듬해 1월" : `${mo + 1}월`; // 丑월은 절기년의 이듬해 양력 1월
  const desc = [...mes].sort((a, b) => b.score - a.score);
  const good = desc.slice(0, 3).filter((x, i) => i < 2 || x.score > 0).map(me => ({
    mOrd: me.mOrd,
    name: nameOf(me.mOrd),
    tag: tagOfMonth(me, 1),
    relative: me.score <= 0
  }));
  const asc = [...mes].sort((a, b) => a.score - b.score);
  const bad = asc.slice(0, 3).filter((x, i) => i < 2 || x.score < 0).map(me => ({
    mOrd: me.mOrd,
    name: nameOf(me.mOrd),
    tag: tagOfMonth(me, -1),
    relative: me.score >= 0
  }));
  return {
    topArea,
    bottomArea,
    good,
    bad
  };
}

// 년운: 등급 없음 — 평생(5~95세) 분포 내 위치 + 프로파일

  const topPct = Math.min(100, Math.max(1, Math.round(rank / total * 100))); // 상위 % = 순위/전체

          d: `${pa}(${AREA[pa]}) ${brJ(a, J_WA)} ${pb}(${AREA[pb]}) ${brJ(b, J_GA)} 육합(六合)으로 손을 잡습니다. 두 영역의 인연이 유난히 끈끈해, 사람과 정으로 풀리는 일이 많은 구조입니다.`
        });
      } else if (a === b && hyungHit(a, b)) {
        out.push({
          t: "자형",
          d: `${pa}와 ${pb}에 같은 ${brJ(a, J_GA)} 겹쳐 자형(自刑)을 이룹니다. 스스로를 다그치다 탈이 나기 쉬운 구조이니, 자기 비판이 심해질 때 의식적으로 멈추는 습관이 필요합니다.`
        });
      } else if (hyungHit(a, b)) {
        out.push({
          t: "형",
          d: `${pa}(${AREA[pa]}) ${brJ(a, J_WA)} ${pb}(${AREA[pb]}) ${BRANCHES[b]} 사이에 형(刑)이 있습니다. 일을 키우는 과정에서 마찰·시비·문서 분쟁이 따라붙기 쉬운 구조입니다. 계약과 서류만 평생 남보다 두 배 꼼꼼히 챙기면, 형은 오히려 일을 정교하게 다듬는 힘이 됩니다.`
        });
      }
    }
  }
  const set = brs.map(([, b]) => b);
  for (const g of SAMHAP_GROUPS) {
    if (g.set.every(x => set.includes(x))) {
      out.push({
        t: "삼합",
        d: `지지에 삼합 ${g.name}이 완성되어 있습니다. ${EL_HANJA[g.el]} 기운이 명식의 큰 축을 이루어, 그 방면의 기질과 인연이 평생을 관통합니다.`
      });
    }
  }
  for (const g of SAMHYUNG_GROUPS) {
    if (g.set.every(x => set.includes(x))) {
      const basis = g.set.map(br => `${(brs.find(([, b]) => b === br) || ["?"])[0]} ${BRANCHES[br]}`).join(" + ");
      out.push({
        t: "삼형",
        d: `지지에 ${g.name} 삼형이 모두 갖춰져 있습니다(근거: ${basis}). ${g.gloss}입니다. 평생에 걸쳐 계약·서류·건강 문제를 남보다 한 번 더 점검하는 습관이 필요하고, 운에서 같은 글자가 다시 들어오는 시기에는 특히 조심해야 합니다.`
      });
    }
  }
  /* v6.3: 원국 상존 백호·양인 — 체질로서 총사주에서만 언급 (일운 반복 노출 금지) */
  const pls = [["년주", natal.yearP], ["월주", natal.monthP], ["일주", natal.dayP]];
  if (natal.timeP) pls.push(["시주", natal.timeP]);
  for (const [pos, pl] of pls) {
    if (BAEKHO.has(`${pl[0]}-${pl[1]}`)) {
      out.push({
        t: "백호",
        d: `${pos} ${STEMS[pl[0]]}${BRANCHES[pl[1]]}이 백호대살에 해당합니다. 급한 기운을 품은 체질이라 몸 쓰는 일·날붙이·차 앞에서 남보다 한 박자 조심하는 습관이 평생의 보험이 됩니다. 운이 이 기둥을 충·형으로 건드리는 날에만 일운에 따로 표시합니다.`
      });
    }
  }
  const yi = YANGIN[natal.dayP[0]];
  if (yi != null) {
    const hit = pls.filter(([, pl]) => pl[1] === yi);
    if (hit.length) {
      out.push({
        t: "양인",
        d: `${hit.map(([p]) => p).join("·")}의 ${brJ(yi, J_GA)} 일간 ${STEMS[natal.dayP[0]]}의 양인(羊刃)입니다. 결단력과 추진력의 칼을 타고난 구조이나, 그 칼이 과로와 승부욕으로 나를 향하기도 합니다. 운이 이 글자를 충·형으로 건드리는 시기에는 무리한 강행을 삼가야 합니다.`
      });
    }
  }
  return out;
}

function isDupCon(x, y) {
  // 원인 태그 "(…)"(중첩 괄호 포함)와 접속어는 같은 원인의 정당한 반복이므로 비교에서 제외 — 행동 문장만 대조
  const stripTag = s => {
    const t = s.replace(/\.\s*$/, "");
    const i = t.lastIndexOf(" (");
    return i > 0 && t.endsWith(")") ? t.slice(0, i) : s;
  };
  const norm = s => stripTag(s).replace(/\([^()]*\)/g, "").replace(/다만 — |그리고 — /g, "").replace(/\s+/g, " ").trim();
  x = norm(x);
  y = norm(y);
  if (x === y) return true;
  const lw = s => s.replace(/[()..·]/g, " ").trim().split(/\s+/).slice(-2).join(" ");
  if (lw(x) === lw(y)) return true;
  for (let i = 0; i + 10 <= x.length; i++) if (y.indexOf(x.slice(i, i + 10)) >= 0) return true;
  return false;
}

  for (const cat of ["money", "work", "love", "health"]) {
    const t = prof ? catTextV3(cat, a, prof, strength, seed, kind) : catText(cat, a.tgS, strength);
    let c = t.c;
    let guard = 0;
    if (t.alt && done.some(p => isDupCon(p, c))) c = t.alt; // 이벤트 절이 겹치면 기본 결론으로
    while (done.some(p => isDupCon(p, c)) && guard < 3) {
      c = CAT_FALLBACK_CON[cat][(seed + guard) % CAT_FALLBACK_CON[cat].length];
      guard++;
    }
    done.push(c);
    outs[cat] = prof ? {
      d: t.d,
      c,
      tg: t.tg,
      sign: t.sign,
      tag: c === t.c ? t.tag : ""

/* 일운 총운 조립: 도입(장면 극성 기준 + 등급 어긋남엔 다리 문장) + 장면(십성 소재) + 결론(지침+완충+반전)

    if (key === "good" && scenePol === "n") intro += " 그래도 오늘은 감당할 힘이 있는 날입니다.";else if (key === "warn" && scenePol === "p") intro += " 다만 오늘은 벌린 만큼 새기 쉬운 날입니다.";
  }

/* 월운 총운 조립: 달 성격 + 장면 + 지침 + 반전 단서 한 호흡 */

/* ─── v6.6 총사주 4축 조립 — 엔진 기존 데이터(일간·오행분포·격국·신강약·급소·왕쇠·대운/세운 점수)만 문장화. 신규 판정 없음 ─── */

function seasonOf(mb) {
  return [2, 3, 4].includes(mb) ? "봄" : [5, 6, 7].includes(mb) ? "여름" : [8, 9, 10].includes(mb) ? "가을" : "겨울";

/* 대운 평생 서사 — yearDist(기존 세운 점수)를 대운 마디 평균으로 묶는다 */
function daewoonNarrative(prof, nowYear) {
  const yd = yearDist(prof);
  const marks = [];
  for (let i = 0; i < prof.dw.list.length; i++) {
    const d = prof.dw.list[i];
    const from = d.from.y;
    const to = i + 1 < prof.dw.list.length ? prof.dw.list[i + 1].from.y : from + 10;
    const ys2 = yd.list.filter(x => x.year >= from && x.year < to);
    if (!ys2.length) continue;
    marks.push({
      d,
      i,
      from,
      to,
      mean: ys2.reduce((s, x) => s + x.score, 0) / ys2.length
    });
  }
  const sorted = [...marks].sort((a, b) => b.mean - a.mean);
  const bestI = sorted[0].i,
    worstI = sorted[sorted.length - 1].i;
  const second = sorted[1] ? sorted[1].i : -1;
  const phraseOf = m => {
    if (m.i === bestI) return "평생에서 가장 힘이 실리는 마디";
    if (m.i === second) return "순풍이 부는 마디";
    if (m.i === worstI) return "가장 조여드는 마디 — 벌이기보다 지키는 십 년";
    const r = sorted.findIndex(x => x.i === m.i) / (sorted.length - 1);
    return r < 0.45 ? "대체로 우호적인 마디" : r > 0.65 ? "속도를 줄여 내실을 다질 마디" : "좋고 나쁨이 섞여 흐르는 마디";
  };
  const cur = marks.find(m => nowYear >= m.from && nowYear < m.to) || null;
  return {
    marks,
    phraseOf,
    cur,
    bestI,
    worstI
  };
}

/* BEGIN CORE3 — v1.7 오늘의 핵심 3문장(한 줄씩) + 분야 문장 압축, v1.8 월운·년운 공통(기간어 치환) (난수 금지 — 모든 선택은 날짜 시드로 결정론적)

/* 조사 자동 선택 — 간지 한자의 한글 독음 받침으로 판단 */

function coreMove(a, seed, kind = "day") {

/* ④ 월운 리듬 — 반전 단서 + 이달의 좋은 날·조심할 날(일운 분포에서) */
function monthRhythm(a, prof) {
  const days = a.sajuYear != null ? dayDist(prof, a.sajuYear).days.filter(x => x.mOrd === a.mOrd) : [];
  const fmt = x => `${x.m}/${x.d}`;
  const byScore = [...days].sort((x, y) => y.score - x.score);
  const good = byScore.slice(0, 3).filter(x => x.score > 0).sort((x, y) => x.m * 40 + x.d - (y.m * 40 + y.d));
  const bad = byScore.slice(-2).filter(x => x.score < 0).sort((x, y) => x.m * 40 + x.d - (y.m * 40 + y.d));
  const parts = [];
  if (a.clue) parts.push(a.clue.replace(/\s*$/, ""));
  const dl = [];
  if (good.length) dl.push(`좋은 날 ${good.map(fmt).join("·")}`);
  if (bad.length) dl.push(`조심 ${bad.map(fmt).join("·")}`);
  if (dl.length) parts.push(dl.join(" · ") + ".");
  return {
    t: parts.join(" ") || "달 안의 기울기가 고릅니다 — 평소 리듬대로.",
    tag: "일운 분포 기준"
  };
}
/* ④ 년운 달력 — 좋은 달·조심할 달 */
function yearCalendar(a) {
  const yp = a.yearProfile;
  const byM = (x, y) => x.mOrd - y.mOrd;
  const g = [...yp.good].sort(byM).map(x => x.name).join("·");
  const b = [...yp.bad].sort(byM).map(x => x.name).join("·");
  const goodRel = yp.good.every(x => x.relative);
  const badRel = yp.bad.every(x => x.relative);
  const t = `${goodRel ? "그나마 숨 트이는 달" : "일을 싣는 달"} ${g} · ${badRel ? "느슨한 달" : "매듭 조이는 달"} ${b}.`;
  return {
    t,
    tag: "월운 12개월 기준"
  };
}

}

.sj-foldbody p+p{margin-top:8px;border-top:1px dashed #EFE4CC;padding-top:7px}
.sj-catrow{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed #E0D5BC;align-items:flex-start}
.sj-catrow:last-child{border-bottom:none;padding-bottom:2px}
.sj-cattag{flex-shrink:0;width:28px;height:28px;border:1px solid #B8352B;color:#B8352B;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif KR',serif;font-size:13px;font-weight:600;margin-top:2px}
.sj-catbody{flex:1;min-width:0}
.sj-catname{font-size:11px;color:#8A6F4D;letter-spacing:.1em;display:block;margin-bottom:3px;font-weight:500}
.sj-storyhead{display:flex;align-items:baseline;gap:8px;margin:14px 0 2px;padding-top:10px;border-top:1px solid #D8CBAE}
.sj-storyhead .hj{font-family:'Noto Serif KR',serif;font-size:16px;color:#B8352B;font-weight:600}
.sj-storyhead .ko{font-size:11px;color:#8A6F4D;letter-spacing:.1em}
.sj-story .sj-catname{letter-spacing:.04em;font-size:11.5px;color:#5E4B32;margin-bottom:5px}
.sj-story .sj-text{margin:0 0 7px}
.sj-storycard p{padding-left:0;font-size:13px;line-height:1.8;color:#2A251E;margin:6px 0}
.sj-storycard p::before{content:none}
.sj-storycard .sh{display:inline-block;font-weight:700;color:#8A3A2B;font-size:12px;letter-spacing:.06em;margin-bottom:2px}
.sj-storycard p+p{border-top:1px dashed #E0D5BC;padding-top:8px}
.sj-text{font-size:13px;line-height:1.8;color:#3A332A;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.sj-concl{margin-top:8px;background:#fff;border:1px solid #E8C9C2;border-left:3px solid #B8352B;border-radius:4px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start}
.sj-concl .cl{flex-shrink:0;font-size:10px;color:#FBF7EC;background:#B8352B;border-radius:2px;padding:2.5px 7px;letter-spacing:.15em;margin-top:2px;font-weight:700}
.sj-concl p{margin:0;font-size:13px;line-height:1.7;color:#26221C;font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.sj-rel{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #EAE0C8}
.sj-rel:last-child{border-bottom:none}
.sj-rel .rt{flex-shrink:0;border:1px solid #8A6F4D;color:#6E5A3A;font-size:10.5px;padding:2.5px 8px;border-radius:2px;font-family:'Noto Serif KR',serif;margin-top:2px;white-space:nowrap}
.sj-rel p{margin:0;font-size:12.5px;line-height:1.75;color:#3A332A;word-break:keep-all;overflow-wrap:anywhere}
.sj-elbars{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.sj-eb{display:flex;align-items:center;gap:8px;font-size:12px}
.sj-eb .el{width:16px;font-family:'Noto Serif KR',serif;font-weight:700;text-align:center;flex-shrink:0}
.sj-eb .bar{flex:1;height:8px;background:#EFE7D2;border-radius:4px;overflow:hidden}
.sj-eb .bar div{height:100%;border-radius:4px}
.sj-eb .val{width:30px;text-align:right;color:#8A6F4D;flex-shrink:0}
.sj-dwlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sj-dw{display:grid;grid-template-columns:auto auto auto 1fr;gap:3px 10px;align-items:baseline;font-size:12.5px;padding:8px 10px;border:1px solid #E0D5BC;border-radius:4px;background:#fff}
.sj-dw.cur{border:1.5px solid #B8352B;background:#FCF6EA}
.sj-dw .age{color:#8A6F4D;font-weight:600;white-space:nowrap}
.sj-dw .gz{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;white-space:nowrap}
.sj-dw .tgs{color:#6E6552;font-size:11px;white-space:nowrap}
.sj-dw .now{background:#B8352B;color:#FBF7EC;font-size:10px;padding:2px 7px;border-radius:2px;justify-self:end;white-space:nowrap}
.sj-dw .desc{grid-column:1/-1;color:#3A332A;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.sj-foot{margin-top:26px;font-size:11px;color:#9A8F77;line-height:1.75;border-top:1px solid #D4C7AB;padding-top:11px;word-break:keep-all;overflow-wrap:anywhere}
@keyframes sjUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sj-pillar,.sj-lcard{animation:none}}

    if (actLabel) inner += '<button id="install-do" style="flex-shrink:0;height:30px;padding:0 12px;background:#8A6F4D;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700">' + actLabel + '</button>';
    inner += '<button id="install-x" aria-label="닫기" style="flex-shrink:0;width:30px;height:30px;background:transparent;color:#E9E0CC;border:1px solid #5f5140;border-radius:6px;font-size:15px">×</button>';
    b.innerHTML = inner;
    document.body.appendChild(b);
    var pad = document.createElement("style"); pad.id = "install-pad";

    // 문구가 2줄로 접혀도 가리지 않도록 실제 바 높이만큼 상단 여백 예약(offsetHeight엔 safe-area 포함).
    syncTop = function () { if (b.parentNode) pad.textContent = "body{padding-top:" + b.offsetHeight + "px}"; };
    syncTop();
    window.addEventListener("resize", syncTop);
    window.addEventListener("orientationchange", syncTop);
    if (actLabel && onAct) document.getElementById("install-do").onclick = onAct;
    document.getElementById("install-x").onclick = function () {
      dismissed = true;
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
      removeBar();
    };
  }
  function androidBar() {
    bar("설치하면 다음부터 홈 화면 아이콘으로 바로 열려요.", "설치", function () {

    if (document.body) androidBar(); else document.addEventListener("DOMContentLoaded", androidBar);

  if (/iPhone|iPad|iPod/i.test(ua) && !window.MSStream) {          // iOS: beforeinstallprompt 없음 → 안내만
    var mk = function () { bar("설치하면 홈 화면 아이콘으로 바로 열려요 — 사파리 <b>공유 → 홈 화면에 추가</b>", null, null); };

  }
